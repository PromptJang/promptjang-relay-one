[package]
name = "promptjang-relay-one"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Durable delivery for webhooks and agents, in one local app"

[dependencies]
anyhow = "1"
aes-gcm = "0.10"
argon2 = "0.5"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
directories = "6"
hex = "0.4"
hmac = "0.12"
ipnet = "2.12"
mime_guess = "2"
open = "5"
opentelemetry = { version = "0.32", features = ["metrics", "logs", "trace"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
opentelemetry-appender-tracing = "0.32"
opentelemetry-http = "0.32"
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["http-proto", "reqwest-blocking-client", "reqwest-rustls", "metrics", "logs", "trace"] }
opentelemetry-semantic-conventions = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio", "metrics", "logs", "trace"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rust-embed = "8"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "postgres", "uuid", "chrono", "json", "migrate"] }
standardwebhooks = "=1.0.1"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt-multi-thread", "signal", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower-http = { version = "0.6", features = ["fs", "trace", "set-header"] }
tracing = "0.1"
tracing-opentelemetry = "0.33"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
