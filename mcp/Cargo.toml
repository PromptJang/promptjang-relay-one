[package]
name = "promptjang-relay-mcp"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "MCP stdio server for the PromptJang Relay agent mailbox"

[dependencies]
promptjang-relay = { path = ".." }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json"] }
tokio = { version = "1", features = ["io-std", "macros", "rt-multi-thread"] }
uuid = { version = "1", features = ["v4"] }
