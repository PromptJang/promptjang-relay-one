name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.89"
          components: clippy,rustfmt

      - name: Verify Rust service
        run: |
          cargo fmt --check
          cargo test
          cargo clippy --all-targets -- -D warnings

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Verify Vue UI
        working-directory: web
        run: |
          npm ci
          npm run verify:signing
          npm run build

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create container metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/promptjang/promptjang-relay
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and publish container
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign container manifest
        run: cosign sign --yes ghcr.io/promptjang/promptjang-relay@${{ steps.build.outputs.digest }}

      - name: Publish release notes
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
