name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm run build
        working-directory: web
      - run: cargo fmt --all -- --check
      - run: cargo test --locked
      - run: cargo clippy --all-targets --locked -- -D warnings

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            archive: promptjang-relay-one-macos-x86_64.tar.gz
          - runner: macos-15
            target: aarch64-apple-darwin
            archive: promptjang-relay-one-macos-aarch64.tar.gz
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            archive: promptjang-relay-one-windows-x86_64.zip
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive: promptjang-relay-one-linux-x86_64.tar.gz
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: promptjang-relay-one-linux-aarch64.tar.gz
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm run build
        working-directory: web
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package Unix bundle
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir bundle
          cp "target/${{ matrix.target }}/release/promptjang-relay-one" bundle/
          cp README.md LICENSE RELEASE_NOTES.md bundle/
          cp -R skills bundle/
          tar -C bundle -czf "${{ matrix.archive }}" .
      - name: Package Windows bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path bundle
          Copy-Item "target/${{ matrix.target }}/release/promptjang-relay-one.exe" bundle/
          Copy-Item README.md,LICENSE,RELEASE_NOTES.md bundle/
          Copy-Item -Recurse skills bundle/
          Compress-Archive -Path bundle/* -DestinationPath "${{ matrix.archive }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: artifacts/promptjang-relay-one-*
      - uses: sigstore/cosign-installer@v3
      - uses: anchore/sbom-action/download-syft@v0
      - name: Generate checksums, SBOMs, and Sigstore bundles
        shell: bash
        run: |
          cd artifacts
          sha256sum promptjang-relay-one-* > SHA256SUMS
          for archive in promptjang-relay-one-*; do
            syft "$archive" -o spdx-json="${archive}.spdx.json"
            cosign sign-blob --yes --bundle "${archive}.sigstore.json" "$archive"
          done
          cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          prerelease: false
          files: artifacts/*
          fail_on_unmatched_files: true
